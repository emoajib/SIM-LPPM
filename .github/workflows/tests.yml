name: 🚀 CI — Test & Code Quality

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Code Style (Laravel Pint)
  # ──────────────────────────────────────────────
  lint:
    name: 🎨 Code Style (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Run Laravel Pint
        run: vendor/bin/pint --test

  # ──────────────────────────────────────────────
  # JOB 2: Static Analysis (PHPStan via Larastan)
  # ──────────────────────────────────────────────
  analyse:
    name: 🧠 Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate Key
        run: php artisan key:generate

      - name: Run PHPStan
        run: vendor/bin/phpstan analyze --memory-limit=2G --level=5

  # ──────────────────────────────────────────────
  # JOB 3: Automated Tests (Pest — SQLite)
  # ──────────────────────────────────────────────
  test:
    name: 🧪 Tests (Pest + SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          extensions: mbstring, xml, ctype, iconv, bcmath, gd, zip, intl, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm ci

      - name: Copy .env & Setup SQLite
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Generate Key & Migrate
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          php artisan key:generate
          php artisan migrate --force

      - name: Build Frontend Assets
        run: npm run build

      - name: Verify committed build matches source (BC-07)
        run: |
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)
          SOURCE_CHANGED=$(printf '%s\n' "$CHANGED_FILES" | grep -E '^(resources/js/|resources/css/|vite.config\.|package\.json|package-lock.json)' || true)
          BUILD_CHANGED=$(printf '%s\n' "$CHANGED_FILES" | grep -E '^public/build/' || true)

          if [ -n "$SOURCE_CHANGED" ] && [ -z "$BUILD_CHANGED" ]; then
            echo "::error::Source frontend berubah tetapi public/build tidak ikut di-commit (BC-07). Jalankan 'npm run build' lalu commit public/build."
            exit 1
          fi

          echo "BC-07 build check: OK (build stage sukses; source/build commit konsisten)."

      - name: Theme, Modern Page & Regression Guards
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          php artisan theme:check
          php artisan modern:check
          php artisan regression:check
          php artisan copy:check

      - name: Run Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: ./vendor/bin/pest

      - name: Check MySQL Column Orders (Offline — informational)
        run: php artisan mysql-column-orders:check || true
# Vetted by SOSIOMEN - Manual Review Required by Senior Engineer/Manager
